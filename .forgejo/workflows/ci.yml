# Runs in Forgejo, where the pull requests are. GitHub keeps its own workflows:
# a repository with .forgejo/workflows/ makes Forgejo ignore .github/workflows
# entirely, so this cannot live there.
name: ci

on:
  pull_request

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - name: api
        run: |
          cd packages/api
          npm ci
          npm run build
      - name: web
        run: |
          cd packages/web
          npm ci
          npm run lint
          npm run build
      # The desktop client is built only on release tags, so a lockfile out of
      # sync with package.json would otherwise surface first in a release or Copr.
      - name: desktop
        run: |
          cd packages/desktop
          npm ci
          for f in main.js preload.js connection.js main/*.js; do node --check "$f" || exit 1; done
