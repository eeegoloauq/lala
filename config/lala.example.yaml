# Lala server config. Copy to config/lala.yaml and restart the api container; calls
# in progress keep going. Without the file everyone is a guest who may do everything.
# A mistake here (an unknown key, a misspelled level) stops the API with a message
# naming the line it means.

# Shown at the top of the room list.
name: Lala

# The default look for people who haven't picked a theme: a built-in theme (discord, winxp,
# dark, amoled, light; discord without this) with some colors and sizes changed. Colors as "#rrggbb", sizes
# in px (avatarRadius also in %). People can still pick their own theme and add CSS.
# theme:
#   base: discord
#   colors:
#     accent: "#e05a6f"      # also: background, surface, sidebar, text, textSecondary, textMuted, border
#   sizes:
#     radius: 8px            # also: radiusLarge; avatarRadius (50% is a circle)

# People are named by their ID: Settings → Profile → "Your ID" in the app. An ID belongs
# to one browser or desktop app, so list each device someone uses.
users:
  # alex:
  #   role: admin            # admin: moderates every room; member: gets "members" rights
  #   ids:
  #     - 0123456789abcdef0123456789abcdef0123
  #     - fedcba9876543210fedcba9876543210fedc

# Whether people not listed under users may use the server at all.
guests: true

# Who may do what, as everyone, members (members and admins) or admins. Rooms below can
# override any of them; rooms people create get these.
defaults:
  createRooms: everyone    # or nobody, to allow only the rooms below
  join: everyone
  speak: everyone
  video: everyone
  screen: everyone         # screen sharing
  chat: everyone           # chat and files

# Rooms that always exist, shown first and in this order. Each takes name and,
# optionally, password (also the encryption key), maxParticipants (0 = no limit) and
# any of join, speak, video, screen, chat.
rooms:
  # - name: General
  # - name: Stage
  #   speak: admins          # everyone else listens and watches
  #   screen: admins
  # - name: Members
  #   join: members
  #   password: change-me

# Text chats, listed above the rooms. Each takes name and, optionally, id (its history is
# kept under it; by default the name in lowercase with dashes), topic (a line under the
# name) and post: who may write (everyone, members, admins; everyone reads). Admins delete
# any message and pin messages; everyone deletes their own.
chats:
  # - name: general
  #   topic: Anything goes
  # - name: announcements
  #   post: admins

# Rules shown above the chats. With required: true, people must agree before they can
# use the server; editing the text asks everyone to agree again.
# rules:
#   required: true
#   text: |
#     # Welcome
#     1. Be kind.
#     2. No spam or ads.

# How much chat history is kept; pinned messages stay. By default the newest 10,000
# messages per chat, however old. Redis keeps history in memory: 0 keeps every message.
# chatHistory:
#   messages: 10000       # per chat; 0 for no limit
#   days: 365             # optional: also remove messages older than this
# Files sent in chats, kept in the chat_files volume. When space runs out the oldest go first.
# chatFiles:
#   space: 1GB            # also raise your reverse proxy's upload limit to this
#   maxFile: 25MB         # optional: the most one file may be; without it, the space

# Programs that join calls (see docs/api.md). Make a credential with
# `docker compose exec api node dist/bot-secret.js <key>`: the bot gets the credential, this
# file gets only the hash. A bot never moderates or creates rooms. Its identity is bot-<key>
# and everyone sees it marked as a bot.
bots:
  # radio:
  #   name: Radio
  #   avatar: radio.png      # optional, an image in this directory, under 24 KB
  #   secret: "scrypt$16384$8$1$…"
  #   rooms: [General]       # rooms from the list above
  #   rights: [speak, chat]  # any of speak, chat, listen; listen lets it hear and see the call
  #   invite: members        # optional: who may add it to any room without a password
  #                          # (everyone, members, admins); then rooms may be left out
  #   publicKey: "…"         # optional, base64 X25519; reserved for password rooms, not used yet
