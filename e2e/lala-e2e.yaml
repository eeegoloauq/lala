# Server config for the e2e suite. The IDs are the identities the test secret in
# livekit-e2e.yaml gives the device IDs "e2e-admin-device" and "e2e-member-device".
users:
  admin:
    role: admin
    ids: [8f9e356ea233564e859aa89b8b518e6a15f0]
  member:
    role: member
    ids: [9046178020158a6b425b6646b40e25c2ca74]

rooms:
  - name: Lobby
  - name: Stage
    speak: admins
  - name: Members
    join: members
    password: members-password
  - name: Bots

# Secrets: e2e-<key>-secret-not-used-outside-tests (see tests/bots.spec.ts).
bots:
  radio:
    name: Radio
    secret: "scrypt$16384$8$1$Yh2ASz2epSoWBVgaL546mw==$M2HEIWWs5sDSp4Oak3ATwjHiZLpUd/o4IdF5wvTeJZQ="
    rooms: [Bots]
    rights: [speak, chat]
  minutes:
    name: Minutes
    secret: "scrypt$16384$8$1$opl/ysRCdq3cpPsg9yvA1w==$AJZr0e6awiGiFmEJSxPsEFwVsq7Uk7Ycrjsncc+TTyM="
    rooms: [Bots]
    rights: [chat, listen]

# The default theme for anyone who hasn't picked one (tests/appearance.spec.ts).
theme:
  base: light
  colors:
    accent: "#3366ff"
  sizes:
    radius: 4px
