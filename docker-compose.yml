services:
  # ─── LiveKit Media Server ───
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: lala-livekit
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # These values are spliced into the config with sed; |, & and \ would corrupt it.
        for v in "$$LIVEKIT_API_KEY" "$$LIVEKIT_API_SECRET" "$$REDIS_PASSWORD" "$$NODE_IP" "$$LIVEKIT_DOMAIN"; do
          case "$$v" in *[\|\&\\]*) echo "LiveKit settings in .env must not contain |, & or \\" >&2; exit 1 ;; esac
        done
        sed \
          -e 's|$${NODE_IP}|'"$$NODE_IP"'|g' \
          -e 's|$${LIVEKIT_DOMAIN}|'"$$LIVEKIT_DOMAIN"'|g' \
          -e 's|$${LIVEKIT_API_KEY}|'"$$LIVEKIT_API_KEY"'|g' \
          -e 's|$${LIVEKIT_API_SECRET}|'"$$LIVEKIT_API_SECRET"'|g' \
          -e 's|$${REDIS_PASSWORD}|'"$$REDIS_PASSWORD"'|g' \
          /etc/livekit-template.yaml > /etc/livekit.yaml \
        && /livekit-server --config /etc/livekit.yaml --node-ip $$NODE_IP
    environment:
      - NODE_IP=${NODE_IP}
      - LIVEKIT_DOMAIN=${LIVEKIT_DOMAIN}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7880/"]
      interval: 15s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:7880:7880" # API + WebSocket signaling (public via the proxy)
      - "7881:7881"       # ICE/TCP fallback
      - "50000:50000/udp" # WebRTC media (UDP mux)
      - "3478:3478/udp"   # TURN (UDP) — for clients behind strict NAT
    networks:
      - default
      - edge
    volumes:
      - ./livekit.yaml.example:/etc/livekit-template.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  # ─── Redis (LiveKit state) ───
  redis:
    image: redis:7-alpine
    container_name: lala-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── API Server (token + rooms) ───
  api:
    image: ${LALA_REGISTRY:?set LALA_REGISTRY in .env}/lala-api:${LALA_TAG:?set LALA_TAG in .env (latest, a version, edge or a commit SHA)}
    container_name: lala-api
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - LIVEKIT_URL=${LIVEKIT_URL:?set LIVEKIT_URL in .env to the public wss:// URL clients connect to}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      - API_PORT=3001
      - LIVEKIT_HOST=lala-livekit:7880
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - LALA_ACCESS_PASSWORD=${LALA_ACCESS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@lala-redis:6379
      - LALA_CONFIG=/config/lala.yaml
    # A directory, not the file: without config/lala.yaml the API runs as an open server.
    volumes:
      - ./config:/config:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - livekit

  # ─── Web Frontend ───
  web:
    image: ${LALA_REGISTRY:?set LALA_REGISTRY in .env}/lala-web:${LALA_TAG:?set LALA_TAG in .env (latest, a version, edge or a commit SHA)}
    container_name: lala-web
    restart: unless-stopped
    environment:
      CSP_CONNECT_SRC: "${CSP_CONNECT_SRC:-wss: ws:}"
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - api

networks:
  edge:
    external: true

volumes:
  redis_data:
