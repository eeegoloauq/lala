# Publishes the static demo (packages/web, `npm run build:demo`) to this
# repository's GitHub Pages site, https://eeegoloauq.github.io/lala/ (Pages
# source: GitHub Actions). The demo answers the API inside the page and places
# no calls, so it needs no server; see packages/web/src/features/demo.
name: demo

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'screenshots/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit's demo matters, but a deploy in progress is left to finish.
concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      # The background blur model is fetched at build by pinned URL and checksum (vite.config.ts).
      - uses: actions/cache@v6
        with:
          path: packages/web/node_modules/.cache/mediapipe
          key: mediapipe-${{ hashFiles('packages/web/vite.config.ts') }}
      # Gives the site's path (/lala), which the build takes as its base.
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: cd packages/web && npm ci && npm run build:demo -- --base "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
