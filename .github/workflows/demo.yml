# Publishes the static demo (packages/web, `npm run build:demo`) to this
# repository's GitHub Pages site, https://eeegoloauq.github.io/lala/ (Pages
# source: GitHub Actions). The demo answers the API inside the page and places
# no calls, so it needs no server; see packages/web/src/features/demo.
name: demo

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'screenshots/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit's demo matters, but a deploy in progress is left to finish.
concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      # The background blur model is fetched at build by pinned URL and checksum (vite.config.ts).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/web/node_modules/.cache/mediapipe
          key: mediapipe-${{ hashFiles('packages/web/vite.config.ts') }}
      # Gives the site's path (/lala), which the build takes as its base.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build
        run: cd packages/web && npm ci && npm run build:demo -- --base "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: packages/web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
